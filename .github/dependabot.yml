version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
    cooldown:
      default-days: 3
    # minor/patch are handled by the npm-update workflow
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x: caret blocks minors, so npm update can't reach them
      - dependency-name: "@vercel/ncc"
        update-types: ["version-update:semver-minor"]
    groups:
      nodejs-major:
        applies-to: version-updates
        update-types:
          - major
      nodejs-pre-v1-minor:
        applies-to: version-updates
        patterns:
          - "@vercel/ncc"
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
