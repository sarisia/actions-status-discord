name: "npm update"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *' # At 03:00 on day 1 (monthly)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: update
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        env:
          # workaround for https://github.com/devcontainers/cli/issues/1320
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: npm update --min-release-age=3

      - name: create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet package-lock.json; then
            echo "no changes"
            exit 0
          fi

          month="$(date -u +%Y-%m)"
          branch="npm-update/${month}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add package-lock.json
          git commit -m "chore(deps): npm update ${month}"
          git push --force origin "${branch}"

          gh label create npm-update --color 0366d6 --force
          url="$(gh pr list --head "${branch}" --state open --json url -q '.[0].url')"
          if [ -z "${url}" ]; then
            url="$(gh pr create --head "${branch}" --label npm-update \
              --title "chore(deps): npm update ${month}" \
              --body "$(git diff --stat HEAD~1 HEAD)")"
          fi

          # pushes/PRs made with GITHUB_TOKEN don't trigger test.yml; workflow_dispatch does
          gh workflow run test.yml --ref "${branch}"

          gh pr list --label npm-update --state open --json number,headRefName \
            -q ".[] | select(.headRefName != \"${branch}\") | .number" |
            while read -r number; do
              gh pr close "${number}" --delete-branch --comment "Superseded by ${url}"
            done
