name: "test"
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        env:
          # workaround for https://github.com/devcontainers/cli/issues/1320
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            npm ci
            npm test
            npm run build

      - name: report result
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
